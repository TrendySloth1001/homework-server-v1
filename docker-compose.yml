services:
  # Backend Server
  homework-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homework_server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # Server Configuration
      PORT: 3001
      NODE_ENV: production
      # CORS - Allow frontend origins
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      # Frontend URL for OAuth redirects
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Database (use container hostname)
      DATABASE_URL: postgresql://homework:homework123@postgres:5432/homeworkdb
      # Redis (use container hostname)
      REDIS_URL: redis://:redis123@redis:6379
      # Qdrant (use container hostname)
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      # MinIO/S3 (use container hostname)
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET: homework-media
      S3_REGION: us-east-1
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      # AI Provider
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama2}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300000}
      # OpenAI (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-2000}
      # Rate Limiting
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/api/auth/google/callback}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - homework-network

  # Infrastructure Services
  postgres:
    image: pgvector/pgvector:pg16
    container_name: homework_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: homework
      POSTGRES_PASSWORD: homework123
      POSTGRES_DB: homeworkdb
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U homework -d homeworkdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homework-network

  redis:
    image: redis:7-alpine
    container_name: homework_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homework-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: homework_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    # Note: Qdrant image has no curl/wget, so we skip the healthcheck
    # and rely on the server to handle connection retries
    networks:
      - homework-network

  minio:
    image: minio/minio:latest
    container_name: homework_minio
    restart: unless-stopped
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console UI
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homework-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  minio_data:
    driver: local

networks:
  homework-network:
    driver: bridge
